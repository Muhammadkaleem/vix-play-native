[versions]
agp = "9.2.1"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
hilt = "2.60"
hiltNavigationCompose = "1.2.0"
room = "2.7.0"
datastore = "1.1.1"
mmkv = "2.4.1"
lifecycle = "2.8.7"
splashscreen = "1.0.1"
coil = "2.7.0"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
composeBom = "2024.12.01"
media3 = "1.6.1"
navigationCompose = "2.8.4"
playServicesAds = "25.4.0"
userMessaging = "3.1.0"
playReview = "2.0.2"
work = "2.9.1"
hiltWork = "1.2.0"
